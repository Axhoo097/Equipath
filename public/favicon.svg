<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vibrant_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DBFF" />
      <stop offset="100%" stop-color="#205CFF" />
    </linearGradient>
    <linearGradient id="vibrant_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AFF19" />
      <stop offset="100%" stop-color="#14B700" />
    </linearGradient>
  </defs>
  
  <g transform="translate(24, 24)">
    <!-- Boomerang pattern in high contrast vibrant colors -->
    <path d="M-13,-12 Q-16,-6 -13,-1 L-8,-3 Q-10,-6 -8,-9 L-13,-12 Z" fill="url(#vibrant_blue)" />
    <path d="M12,-13 Q6,-16 1,-13 L3,-8 Q6,-10 9,-8 L12,-13 Z" fill="url(#vibrant_blue)" />
    <path d="M13,12 Q16,6 13,1 L8,3 Q10,6 8,9 L13,12 Z" fill="url(#vibrant_blue)" />
    <path d="M-12,13 Q-6,16 -1,13 L-3,8 Q-6,10 -9,8 L-12,13 Z" fill="url(#vibrant_blue)" />
    
    <!-- Central Cyan E -->
    <text x="-5" y="6" fill="#00DBFF" font-family="'Inter', Arial Black, sans-serif" font-weight="900" font-size="14" style="text-shadow: 0 0 2px rgba(0,219,255,0.5)">E</text>
    
    <!-- Vibrantly Green Leaf -->
    <path d="M-2,-7 Q0,-13 5,-11 Q2,-5 -2,-7 Z" fill="url(#vibrant_leaf)" />
  </g>
</svg>
